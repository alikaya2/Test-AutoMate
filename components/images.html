<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../responsive/responsive.css">
    <title>Iframe Image Gallery - Test Auto Mate</title>
    <style>
        .iframe-container {
            width: 100%;
            height: 85vh;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            background: white;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header id="images-header">
        <h1 id="images-title">Images</h1>
        <nav id="images-navigation">
            <ul id="images-nav-menu">
                <li><a href="../index.html" id="images-nav-home-link">Home</a></li>
                <li><a href="signUp.html" id="images-nav-signup-link">Sign Up</a></li>
                <li><a href="login.html" id="images-nav-login-link">Login</a></li>
                <li><a href="forms.html" id="images-nav-forms-link">Forms</a></li>
                <li><a href="products.html" id="images-nav-products-link">Products</a></li>
                <li><a href="images.html" class="active" id="images-nav-images-link">Images</a></li>
                <li><a href="database.html" id="images-nav-database-link">Database</a></li>
                <li><a href="api.html" id="images-nav-api-link">API</a></li>
                <li><a href="advanced-api.html" id="images-nav-advanced-api-link">Advanced API</a></li>
            </ul>
        </nav>
    </header>
    <main id="images-main">
        <div class="iframe-container" id="images-iframe-container">
            <iframe id="gallery-frame" name="gallery-frame" src="../assets/gallery.html" id="images-gallery-frame"></iframe>
        </div>
    </main>

    <script type="module" src="../scripts/main.js"></script>
    <script>
        // Add scroll effect to header
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('header');
            if (header) {
                window.addEventListener('scroll', function() {
                    if (window.scrollY > 50) {
                        header.classList.add('scrolled');
                    } else {
                        header.classList.remove('scrolled');
                    }
                });
            }
        });
    </script>
</body>
</html>
